<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D+ Counter</title>
<style>
  :root{
    --ink:#0f2a4a;
    --paper:transparent;
    --accent:#0b3d91;
    --dday-size:52pt;
    --title-size:11pt;
    --date-size:9pt;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:transparent;
    height:100%;
    width:100%;
    overflow:hidden;
    scrollbar-width:none; /* Firefox */
    -ms-overflow-style:none; /* IE/Edge */
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar{
    display:none; /* Chrome, Safari */
    width:0;
    height:0;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .card{
    width:90%;
    max-width:300px;
    background:var(--paper);
    border-radius:18px;
    padding:0 32px;
    text-align:center;
  }
  .label{
    font-size:var(--title-size);
    letter-spacing:0.02em;
    color: #00b7ee;
    margin:0 0 2px;
    font-weight:600;
  }
  .label.hidden{
    display:none;
  }
  .dday{
    font-size:var(--dday-size);
    font-weight:800;
    line-height:1;
    color:var(--accent);
    letter-spacing:-0.01em;
    font-variant-numeric: tabular-nums;
  }
  .date-line{
    margin-top:2px;
    font-size:var(--date-size);
    color:var(--ink);
    opacity:0.5;
  }
</style>
</head>
<body>

  <div class="card">
    <p class="label" id="title"></p>
    <div class="dday" id="dday"></div>
    <p class="date-line" id="dateLine"></p>
  </div>

<script>
  // 링크 뒤에 이렇게 붙여서 사용해요:
  // index.html?date=2026-03-29&title=데뷔한날&bg=DFF0FB&accent=0B3D91&size=24&titleSize=11&dateSize=9
  //
  // date      : 필수. 기준 날짜 (YYYY-MM-DD)
  // title     : 선택. 위에 뜨는 작은 라벨 문구 (없으면 라벨 자체가 안 보여요)
  // bg        : 선택. 배경색. HEX(예: DFF0FB, # 없이도 됨), rgb(예: 223,240,251), 또는 transparent
  // accent    : 선택. D+ 숫자 색. 위와 같은 방식
  // size      : 선택. D+ 숫자 크기 (pt 단위 숫자만)
  // titleSize : 선택. 타이틀 라벨 크기 (pt 단위 숫자만)
  // dateSize  : 선택. 하단 날짜 크기 (pt 단위 숫자만)

  const params = new URLSearchParams(window.location.search);
  const TARGET_DATE = params.get("date");
  const TITLE_TEXT = params.get("title") || "";
  const BG_PARAM = params.get("bg");
  const ACCENT_PARAM = params.get("accent");
  const SIZE_PARAM = params.get("size"); // D+ 숫자 크기, pt
  const TITLE_SIZE_PARAM = params.get("titleSize"); // 타이틀 글자 크기, pt
  const DATE_SIZE_PARAM = params.get("dateSize"); // 날짜 글자 크기, pt

  if(SIZE_PARAM && !isNaN(parseFloat(SIZE_PARAM))){
    document.documentElement.style.setProperty("--dday-size", `${parseFloat(SIZE_PARAM)}pt`);
  }
  if(TITLE_SIZE_PARAM && !isNaN(parseFloat(TITLE_SIZE_PARAM))){
    document.documentElement.style.setProperty("--title-size", `${parseFloat(TITLE_SIZE_PARAM)}pt`);
  }
  if(DATE_SIZE_PARAM && !isNaN(parseFloat(DATE_SIZE_PARAM))){
    document.documentElement.style.setProperty("--date-size", `${parseFloat(DATE_SIZE_PARAM)}pt`);
  }

  function toColor(value){
    if(!value) return null;
    const v = value.trim();
    // 완전 투명 (노션 배경이 그대로 비침)
    if(v.toLowerCase() === "transparent" || v.toLowerCase() === "none") return "transparent";
    // rgb(...) 형태를 그대로 넣은 경우
    if(v.startsWith("rgb")) return v;
    // "223,240,251" 형태로 콤마로 넣은 경우
    if(v.includes(",")) return `rgb(${v})`;
    // hex 코드 (# 있어도 되고 없어도 됨)
    return v.startsWith("#") ? v : `#${v}`;
  }

  const bgColor = toColor(BG_PARAM);
  const accentColor = toColor(ACCENT_PARAM);
  if(bgColor) document.documentElement.style.setProperty("--paper", bgColor);
  if(accentColor) document.documentElement.style.setProperty("--accent", accentColor);

  function calcDday(targetStr){
    const target = new Date(targetStr + "T00:00:00");
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffMs = today - target;
    const diffDays = Math.round(diffMs / (1000*60*60*24));
    // 기준일 당일을 1일차로 포함해서 세는 방식 (예: 3/29 시작이면 3/29가 D+1)
    return diffDays >= 0 ? diffDays + 1 : diffDays;
  }

  const ddayEl = document.getElementById("dday");
  const titleEl = document.getElementById("title");
  const dateLineEl = document.getElementById("dateLine");

  if(TITLE_TEXT){
    titleEl.textContent = TITLE_TEXT;
  } else {
    titleEl.classList.add("hidden");
  }

  if(!TARGET_DATE){
    ddayEl.textContent = "날짜를 입력해주세요";
    ddayEl.style.fontSize = "18px";
  } else {
    const days = calcDday(TARGET_DATE);
    if(days > 0){
      ddayEl.textContent = `D+${days}`;
    } else if(days === 0){
      ddayEl.textContent = "D-DAY";
    } else {
      ddayEl.textContent = `D${days}`;
    }
    const [y,m,d] = TARGET_DATE.split("-");
    dateLineEl.textContent = `${y}.${m}.${d}.`;
  }
</script>

</body>
</html>
